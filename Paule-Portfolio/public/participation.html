<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>uCTF Participation — Moises Paule</title>
  <style>
    body { margin:0; font-family: system-ui, Arial, sans-serif; background:#0f1720; color:#fff; }
    .container { max-width:1100px; margin:32px auto; padding:16px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .top a { color:#61dafb; text-decoration:none; }
    h1 { margin:0 0 12px 0; font-size:24px; }
    .gallery { display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:18px; }
    .card { background:#111; border-radius:8px; overflow:hidden; border:1px solid rgba(255,255,255,0.04); display:flex; flex-direction:column; align-items:center; }
    .card img { width:100%; height:160px; object-fit:cover; display:block; }
    .card .caption { padding:10px; font-size:14px; color:var(--dim-white,#c7c7c7); text-align:center; }
    .controls { margin-left:auto; }
    .back { padding:8px 12px; background:#222; color:#fff; border-radius:6px; text-decoration:none; }
    @media (max-width:420px) { .card img { height:120px; } h1 { font-size:20px; } }

    /* make whole card clickable */
    .card-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }
    .card-link:hover .card {
      transform: translateY(-4px);
    }
    .card {
      transition: transform 180ms ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div>
        <h1>uCTF — Participation & Experience</h1>
        <p class="subtitle" style="color:#9aa0a6;margin:6px 0 0 0">Projects, screenshots and notes from my uCTF participation.</p>
      </div>
      <div class="controls">
        <a class="back" href="/" aria-label="Back to home">Back to site</a>
      </div>
    </div>

    <div class="gallery">
      <!-- clickable image card -->
      <div class="card">
        <a class="card-link" href="/participation/score1.png" target="_blank" rel="noopener noreferrer">
          <img src="/participation/score1.png" alt="Experience screenshot 1" />
          <div class="caption">Practice Sessions (1)</div>
        </a>
      </div>

      <div class="card">
        <a class="card-link" href="/participation/score2.png" target="_blank" rel="noopener noreferrer">
          <img src="/participation/score2.png" alt="Experience screenshot 2" />
          <div class="caption">Practice Sessions (2)</div>
        </a>
      </div>

      <div class="card">
        <!-- use a thumbnail linked to the PDF so clicking opens the PDF -->
        <a class="card-link" href="/participation/uctf_cert.pdf" target="_blank" rel="noopener noreferrer">
          <img src="/participation/teams.jpg" alt="Certificate thumbnail" style="width:100%;height:160px;object-fit:cover;" />
          <div class="caption">Certificate</div>
        </a>
      </div>

      <div class="card">
        <a class="card-link" href="/participation/pos.jpg" target="_blank" rel="noopener noreferrer">
            <img src="/participation/pos.jpg" alt="Participation Overview Screenshot" />
            <div class="caption">Placement</div>
      <!-- Add more cards as needed; copy images into public/participation-images/ and update the src -->
    </div>
  </div>
</body>
</html>
