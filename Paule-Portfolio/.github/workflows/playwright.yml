name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 1. Force ALL steps below to run inside your project subfolder
defaults:
  run:
    working-directory: ./Paule-Portfolio

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22 # Explicit Node 22 version to keep things stable
        cache: 'npm'
        # 2. Tell the node cache exactly where your lockfile lives
        cache-dependency-path: './Paule-Portfolio/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        # 3. Fix the artifact path so it uploads the report from the right folder
        path: Paule-Portfolio/playwright-report/
        retention-days: 30

