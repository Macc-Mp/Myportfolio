name: Lighthouse Performance Audit

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  lighthouse-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # If your build outputs static files, point to that folder (e.g., ./dist or ./build)
          # Otherwise, use `serverCommand: npm run start` if it requires a running server
          staticDistDir: './dist' 
          
          # This creates a temporary public report link so you can view the full breakdown
          uploadArtifacts: true 
          temporaryPublicStorage: true
