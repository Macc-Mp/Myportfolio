name: Lighthouse Performance Audit

on:
  pull_request:
    branches: [ main, master ]
    # Only run if frontend files change, saving private repo minutes
    paths:
      - 'Paule-Portfolio/src/**'
      - 'Paule-Portfolio/public/**'
      - 'Paule-Portfolio/package.json'

# Cancel previous runs if a developer pushes new code to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force all terminal commands to run inside your subfolder
defaults:
  run:
    working-directory: ./Paule-Portfolio

jobs:
  lighthouse-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          # Pointing to your specific package-lock location
          cache-dependency-path: './Paule-Portfolio/package-lock.json' 

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Targets the build folder inside Paule-Portfolio
          staticDistDir: './Paule-Portfolio/dist' 
          uploadArtifacts: true 
          temporaryPublicStorage: true
