name: Lighthouse Performance Audit

on:
  pull_request:
    branches: [ main, master ]
    # Saves private repository minutes by only running when frontend files change
    paths:
      - 'Paule-Portfolio/src/**'
      - 'Paule-Portfolio/public/**'
      - 'Paule-Portfolio/package.json'
  workflow_dispatch: # Allows you to trigger this specific workflow manually via the GitHub Actions tab

# Cancels older running builds if you push a new commit to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sets the default terminal location to your subfolder for standard commands
defaults:
  run:
    working-directory: ./Paule-Portfolio

jobs:
  lighthouse-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          # Fixes the Setup-Node lockfile error
          cache-dependency-path: './Paule-Portfolio/package-lock.json' 

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
